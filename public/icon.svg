<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: ink black, rounded (Android adaptive icon safe zone) -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>

  <!-- Inner highlight ring (subtle lime glow) -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#C6FF00" stroke-width="2" opacity="0.15"/>

  <!-- QR motif: 3 corner squares (like a QR code's finder patterns) -->
  <!-- Top-left finder -->
  <rect x="96" y="96" width="88" height="88" rx="14" fill="none" stroke="#C6FF00" stroke-width="14"/>
  <rect x="120" y="120" width="40" height="40" rx="6" fill="#C6FF00"/>

  <!-- Top-right finder -->
  <rect x="328" y="96" width="88" height="88" rx="14" fill="none" stroke="#F2EFE6" stroke-width="14"/>
  <rect x="352" y="120" width="40" height="40" rx="6" fill="#F2EFE6"/>

  <!-- Bottom-left finder -->
  <rect x="96" y="328" width="88" height="88" rx="14" fill="none" stroke="#F2EFE6" stroke-width="14"/>
  <rect x="120" y="352" width="40" height="40" rx="6" fill="#F2EFE6"/>

  <!-- Center: "H" monogram in Anton style (heavy condensed) -->
  <!-- The H is formed by two vertical bars + a horizontal connector -->
  <rect x="220" y="200" width="22" height="112" rx="4" fill="#C6FF00"/>
  <rect x="270" y="200" width="22" height="112" rx="4" fill="#C6FF00"/>
  <rect x="220" y="244" width="72" height="22" rx="4" fill="#C6FF00"/>

  <!-- Bottom-right: small "hand-off" arrow (the brand gesture) -->
  <g transform="translate(328, 328)">
    <rect x="0" y="0" width="88" height="88" rx="14" fill="none" stroke="#FF3B1F" stroke-width="14"/>
    <path d="M28 44 L60 44 M50 34 L60 44 L50 54" stroke="#FF3B1F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Tiny data dots (QR-like scatter, subtle) -->
  <circle cx="256" cy="120" r="6" fill="#F2EFE6" opacity="0.4"/>
  <circle cx="280" cy="120" r="6" fill="#F2EFE6" opacity="0.3"/>
  <circle cx="304" cy="120" r="6" fill="#F2EFE6" opacity="0.4"/>
  <circle cx="256" cy="392" r="6" fill="#F2EFE6" opacity="0.3"/>
  <circle cx="280" cy="392" r="6" fill="#F2EFE6" opacity="0.4"/>
</svg>
